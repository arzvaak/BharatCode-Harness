name: CI

# BharatCode fork gate: prove the product still works before it reaches users.
# Deliberately lean — build, unit suite, and a real profile composition that
# fails when a plugin/bundle row stops activating (the silent-skip class that
# upstream tests cannot catch). Heavier lanes (snapshot/e2e) join when we need
# them, not by copying upstream's enterprise-runner suite.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DSH_TELEMETRY_DISABLED: '1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    name: build + unit + config
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Hosted runners ship no sandbox backend; sandbox-mode tests
      # (read-only/workspace-write confinement) refuse to run unconfined.
      - name: Prepare bubblewrap (sandbox backend)
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build
        run: pnpm run build

      - name: Profile composition gate (plugins must activate)
        run: bash scripts/gates/verify-config.sh

      - name: Unit tests
        run: pnpm run test
