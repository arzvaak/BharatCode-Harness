name: Linux product browser checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-browser-${{ github.ref }}
  cancel-in-progress: true
env:
  DSH_TELEMETRY_DISABLED: '1'
  DSH_SNAPSHOT: replay
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install immutable dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Prepare native sandbox backend
        run: bash scripts/prepare-ci-bubblewrap.sh
      - name: Build the shipped client and host
        run: pnpm run build
      - name: Install Chromium and native browser dependencies
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Replay sidebar scrolling, gestures and document previews
        run: >-
          pnpm run test:web:built
          apps/web/tests/sidebar-scrollbar.e2e.ts
          apps/web/tests/sidebar-title-hover-scroll.e2e.ts
          apps/web/tests/sidebar-right.e2e.ts
          apps/web/tests/document-preview.e2e.ts
