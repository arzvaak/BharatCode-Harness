name: Upstream track

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: upstream-integration
  cancel-in-progress: false

jobs:
  drift:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Fetch and report upstream drift
        run: |
          git remote add upstream https://github.com/deepseek-ai/deepseek-harness.git
          git fetch upstream master --no-tags
          node scripts/compatibility/upstream.mjs report upstream/master HEAD "$RUNNER_TEMP/upstream-report.json"
          cat "$RUNNER_TEMP/upstream-report.json.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Require repository-scoped GitHub App setup
        env:
          APP_ID: ${{ vars.UPSTREAM_APP_ID }}
          PRIVATE_KEY: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo '::error::Upstream candidate automation is blocked: configure UPSTREAM_APP_ID and UPSTREAM_APP_PRIVATE_KEY for the repository-scoped GitHub App. Drift reporting completed; no branch or PR was changed.'
            exit 1
          fi
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.UPSTREAM_APP_ID }}
          private-key: ${{ secrets.UPSTREAM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Prepare or update the reviewed candidate PR
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          gh auth setup-git
          git config user.name 'BharatCode upstream integration'
          git config user.email 'upstream-integration@users.noreply.github.com'
          node scripts/compatibility/automation.mjs
